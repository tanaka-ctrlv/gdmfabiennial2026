<!doctype html>
<!-- The doctype tells the browser to use modern HTML; lang helps assistive technology. -->
<html lang="en">
<head>
  <!-- UTF-8 supports punctuation such as the en dash in the dates. -->
  <meta charset="utf-8">
  <!-- Make CSS viewport units and the mobile layout use the device width. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- This appears in the browser tab. -->
  <title>Additional Editions — RISD Biennial 2026</title>
  <!-- The ?v=1 query can be increased after edits to refresh a cached file. -->
  <link rel="stylesheet" href="./style.css?v=1">
  <!-- defer waits until the HTML has been parsed before running the script. -->
  <script src="./script.js?v=1" defer></script>
</head>
<body>
  <!-- main identifies the primary content; landing is the positioning container. -->
  <main class="landing">
    <!-- Each ribbon is a separate row; script.js fills its empty track with text. -->
    <!-- data-direction="right" reverses the direction of alternate rows in CSS. -->
    <!-- aria-hidden keeps repeated decorative text out of screen-reader navigation. -->
    <div class="ribbon ribbon--one" aria-hidden="true"><div class="track"></div></div>
    <div class="ribbon ribbon--two" data-direction="right" aria-hidden="true"><div class="track"></div></div>
    <div class="ribbon ribbon--three" aria-hidden="true"><div class="track"></div></div>
    <div class="ribbon ribbon--four" data-direction="right" aria-hidden="true"><div class="track"></div></div>
    <div class="ribbon ribbon--five" aria-hidden="true"><div class="track"></div></div>
    <div class="ribbon ribbon--six" data-direction="right" aria-hidden="true"><div class="track"></div></div>

    <!-- p is ordinary informational text; br makes the intended line breaks. -->
    <p class="corner corner--left">Graphic Design<br>MFA Biennial,<br>RISD 2026.</p>
    <p class="corner corner--right">Sol Koffler Gallery<br>10/01/26–10/18/26</p>

    <!-- The foreground panel covers the rows. h1 is the page's main heading. -->
    <!-- Each word has its own span so JS can deform its letters independently. -->
    <div class="hero">
      <div class="hero-panel">
        <h1 class="hero-title">
          <span class="word">Additional</span>
          <span class="word">Editions</span>
        </h1>
      </div>
    </div>

    <!-- JS changes this layer's opacity near either reveal target. -->
    <!-- It sits above the composition but below the two clickable links. -->
    <div class="proximity-dim" aria-hidden="true"></div>

    <!-- a creates a link; href is its destination. Replace these placeholder URLs. -->
    <!-- View Works fades in near the center; the lower-left link stays visible. -->
    <a class="view-works" href="index/">view works</a>
    <a class="footer-link" href="about.html">Additional<br>Editions</a>
  </main>
</body>
</html>
